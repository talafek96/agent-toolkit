name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Ruff check
        run: uvx ruff check .

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Marketplace and skill manifests
        run: python scripts/validate.py
      - name: Bundled scripts run
        run: |
          python plugins/agent-context/skills/claude-md-standards/scripts/lint_claude_md.py --help
          python plugins/agent-context/skills/constitution-writer/scripts/check_constitution.py tests/fixtures/good-constitution.md
          python tests/check_session_hook.py
          python plugins/repo-memory/skills/memory-setup/scripts/check_pitfalls.py tests/fixtures/pitfalls/a
          ! python plugins/repo-memory/skills/memory-setup/scripts/check_pitfalls.py tests/fixtures/pitfalls
