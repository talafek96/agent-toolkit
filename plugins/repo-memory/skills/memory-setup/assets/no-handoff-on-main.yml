name: No handoff on main

on:
  pull_request:
    branches: [main, master]

jobs:
  no-handoff:
    name: No HANDOFF.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HANDOFF.md must be closed before merge
        run: |
          if [ -f HANDOFF.md ]; then
            echo "::error file=HANDOFF.md::Close the branch first: move lasting lessons to PITFALLS.md / CLAUDE.md / rules, then delete HANDOFF.md. See .claude/rules/memory.md."
            exit 1
          fi
